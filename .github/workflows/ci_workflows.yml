name: CI

on:
  schedule:
    # run every day at 4am UTC
    - cron: '0 4 * * *'
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  tests:
    permissions:
      id-token: write
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@8d5ad7efc8e84a051639373f6ea0d10441eafee1  # v3.2.1
    with:
      envs: |
        - macos: py311-test-oldestdeps
        - macos: py312-test
        - macos: py313-test
        - macos: py314-test-devdeps
        - linux: py311-test-oldestdeps
        - linux: py312-test
          runs-on: ubuntu-24.04-arm
        - linux: py313-test
        - linux: py314-test-devdeps
        - windows: py311-test-oldestdeps
        - windows: py312-test
        - windows: py313-test
        - windows: py314-test
      libraries: |
        apt:
          - libopenblas-dev
      coverage: 'codecov-oidc'

  build:
    needs: tests
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish.yml@8d5ad7efc8e84a051639373f6ea0d10441eafee1  # v3.2.1
    if: |
      github.event_name != 'pull_request' ||
      (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'Build wheels')
      )
    with:
      upload_to_pypi: false
      save_artifacts: true
      test_extras: test
      test_command: pytest -n auto --durations=20 -p no:warnings --pyargs reproject
      targets: |
        - cp*-manylinux_x86_64
        - target: cp*-manylinux_aarch64
          runs-on: ubuntu-24.04-arm
        - cp*-macosx_x86_64
        - cp*-macosx_arm64
        - cp*-win_amd64
      env: |
        EXTENSION_HELPERS_PY_LIMITED_API: 'cp311'

      # Developer wheels
      upload_to_anaconda: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
      anaconda_user: astropy
      anaconda_package: reproject
      anaconda_keep_n_latest: 10

    secrets:
      anaconda_token: ${{ secrets.anaconda_token }}

  upload:
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/reproject
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') &&
          !endsWith(github.ref, '.dev') &&
          (
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch'
          )
      }}
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          pattern: dist-*
          path: dist
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
